<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Véletlenszerűen forgatott SVG csempék</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            line-height: 0;
            font-size: 0;
            background-color: #ff0;
        }

        svg {
            display: inline-block;
            vertical-align: top;
            transform-origin: center;
	        stroke: #00f;
	        stroke-width: 2px;
	        stroke-linecap: round;
            stroke-linejoin: round;
	        margin: -3px;
            width: 36px;
            height: 36px;
        }
    </style>
</head>
<body>

    <script>
        const forgatasok = [0, 90];

        const csempeMeretM = 30;
        const oszlopok = Math.ceil(screen.width / csempeMeretM);
        const sorok = Math.ceil(screen.height / csempeMeretM);
        const osszesCsempe = oszlopok * sorok;

        let HTMLTartalom = '';

        for (let i = 0; i < osszesCsempe; i++) {
            const veletlenSzog = forgatasok[Math.floor(Math.random() * forgatasok.length)];

             HTMLTartalom += `<svg viewBox="0 0 12 12" style="transform: rotate(${veletlenSzog}deg);"><path d="M 1,1 11,11" /></svg>`;
        }
        document.body.innerHTML = HTMLTartalom;
    </script>
</body>
</html>
